# Local / single-server deployment: Postgres + API + scheduler/worker + web UI.
#   cp backend/.env.example backend/.env   (edit secrets)
#   docker compose up --build
#   docker compose exec backend python -m app.cli create-admin you@company.com 'a-strong-password'
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: plastic_intel }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/plastic_intel
      CORS_ORIGINS: http://localhost:3000
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/plastic_intel
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on: [backend]
    restart: unless-stopped
  frontend:
    build: { context: ./frontend, args: { BACKEND_URL: "http://backend:8000" } }
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
